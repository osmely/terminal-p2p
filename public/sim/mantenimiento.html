<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />

	<meta name="robots" content="noindex" />

	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="/vendor/fonts.css" />
	<style>
		:root { --bg: #ffffff; --card: #f5f7fa; --line: #e3e8ef; --ink: #0f1722; --muted: #5b6b80; --accent: #3d6fe0; --on-accent: #ffffff; }
		@media (prefers-color-scheme: dark) {
			:root { --bg: #0b0e14; --card: #10151c; --line: #1f2733; --ink: #e9eef6; --muted: #9fb0c6; --accent: #5b8cff; --on-accent: #ffffff; }
		}
		* { box-sizing: border-box; margin: 0; }
		html, body { min-height: 100%; }
		body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
		main { width: 100%; max-width: 460px; padding: 36px 28px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); text-align: center; }
		.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; }
		.mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
		.icon { margin: 30px auto 0; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
		h1 { margin-top: 18px; font-size: 26px; line-height: 1.2; letter-spacing: -0.4px; }
		p { margin-top: 12px; font-size: 16px; line-height: 1.55; color: var(--muted); }
		.actions { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
		.btn { display: block; padding: 13px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--line); color: var(--ink); }
		.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
		.foot { margin-top: 22px; font-size: 13.5px; }
		.foot a { color: var(--accent); text-decoration: none; }
	</style>
</head>
<body>
	<main>
		<a class="brand" href="https://terminalp2p.com">
			<span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 16l4.5-5 3.5 3 7-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg></span>
			Terminal Trading
		</a>
		<div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M14.7 6.3a4 4 0 00-5.4 5.2L3.6 17.2a1.4 1.4 0 002 2l5.7-5.7a4 4 0 005.2-5.4l-2.4 2.4-2.1-.6-.6-2.1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" /></svg></div>
		<h1>El simulador está en mantenimiento</h1>
		<p>Mientras tanto, el terminal P2P sigue funcionando con normalidad.</p>
		<div class="actions">
			<a class="btn primary" href="https://app.terminalp2p.com">Abrir el terminal</a>
			<a class="btn" href="https://terminalp2p.com">Ir a la web</a>
		</div>
		<p class="foot">¿Dudas? Escríbenos en <a href="https://t.me/terminalp2p" target="_blank" rel="noopener">@terminalp2p</a></p>
	</main>
</body>
