<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="robots" content="noindex" />
	<title>Terminal P2P · Libro del P2P de QvaPay</title>
	<link rel="icon" href="/favicon.svg" />
	<!-- El puente del simulador de QvaPay: dentro de la app real y en un navegador normal no hace nada -->
	<script src="https://www.qvapay.com/miniapps/sdk-sim.js"></script>
	<style>
		:root {
			--bg: #0b0e13; --surface: #12171f; --line: #1e2733; --text: #e8ecf2; --muted: #7f8a9c;
			--bid: #22c58f; --ask: #f25467; --accent: #5b8cff;
			--mono: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;
			color-scheme: dark;
		}
		:root[data-theme='light'] { --bg: #f5f6f8; --surface: #fff; --line: #e3e8ef; --text: #131a24; --muted: #6c7889; --bid: #0d9668; --ask: #d72f48; --accent: #2f6bff; color-scheme: light; }
		@media (prefers-color-scheme: light) { :root:not([data-theme='dark']) { --bg: #f5f6f8; --surface: #fff; --line: #e3e8ef; --text: #131a24; --muted: #6c7889; --bid: #0d9668; --ask: #d72f48; --accent: #2f6bff; color-scheme: light; } }
		* { box-sizing: border-box; margin: 0; }
		body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 14px 14px calc(84px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
		header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
		select { width: 100%; height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 600 15px system-ui, sans-serif; }
		.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
		.stat { padding: 9px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
		.stat span { display: block; color: var(--muted); font-size: 11px; }
		.stat b { display: block; font: 700 15px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.stat .ask { color: var(--ask); } .stat .bid { color: var(--bid); }
		section { margin-top: 14px; }
		h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 2px 6px; display: flex; justify-content: space-between; }
		.rows { border-radius: 12px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
		.row { display: grid; grid-template-columns: 1.1fr .8fr 1.2fr; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
		.row:first-child { border-top: 0; }
		.row:active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
		.p { font: 700 14px var(--mono); }
		.ask .p { color: var(--ask); } .bid .p { color: var(--bid); }
		.u { font: 13px var(--mono); text-align: right; }
		.w { color: var(--muted); text-align: right; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.empty { padding: 16px 12px; color: var(--muted); text-align: center; }
		.hint { color: var(--muted); font-size: 12px; margin: 14px 2px 0; }
		.go { position: fixed; left: max(14px, calc(50% - 266px)); right: max(14px, calc(50% - 266px)); bottom: calc(14px + env(safe-area-inset-bottom)); height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 700 16px system-ui, sans-serif; cursor: pointer; }
		.go[hidden] { display: none; }
	</style>
</head>
<body>
	<header>
		<select id="coin" aria-label="Mercado"></select>
		<div class="stats">
			<div class="stat"><span>Mejor venta</span><b class="ask" id="bestAsk">—</b></div>
			<div class="stat"><span>Mejor compra</span><b class="bid" id="bestBid">—</b></div>
			<div class="stat"><span>Tasa QvaPay</span><b id="rate">—</b></div>
		</div>
	</header>
	<section class="ask"><h2><span>Venden USD</span><span id="askN"></span></h2><div class="rows" id="asks"><p class="empty">Cargando…</p></div></section>
	<section class="bid"><h2><span>Compran USD</span><span id="bidN"></span></h2><div class="rows" id="bids"><p class="empty">Cargando…</p></div></section>
	<p class="hint">Libro en vivo del P2P de QvaPay. Toca una oferta para tomarla en Terminal P2P, en tu navegador. Ocultas las de precio atípico.</p>
	<button class="go" id="go">Operar en Terminal P2P</button>
	<script src="mini.js"></script>
</body>
</html>
